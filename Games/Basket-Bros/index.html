<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Basket Bros</title>
  <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- No-op stubs so the game's ad/analytics calls don't crash, and ad "breaks" finish instantly -->
  <script>
    (function(){
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function(){};
      window.SendEvent = window.SendEvent || function(){};
      window.RecordSession = window.RecordSession || function(){};

      function safe(fn){ try{ fn && fn(); }catch(e){} }
      function doneInterstitial(){ if (window.Main && typeof Main.DoneInterstitialAd === 'function') Main.DoneInterstitialAd(false); }
      function doneRewarded(){ if (window.Main && typeof Main.DoneVideoAd === 'function') Main.DoneVideoAd(); }

      window.ShowAdBreak = function(){ safe(doneInterstitial); };
      window.ShowVideo = function(){ safe(doneRewarded); };
      window.ShowAd = function(){ safe(doneInterstitial); };
      window.ShowInterstitial = function(){ safe(doneInterstitial); };
      window.ShowRewarded = function(){ safe(doneRewarded); };
      for (var i = 1; i <= 10; i++) {
        window['ShowAd' + i] = function(){ safe(doneInterstitial); };
        window['ShowVideo' + i] = function(){ safe(doneRewarded); };
      }
      window.adBreak = function(opts){ safe(opts && opts.before); safe(opts && opts.after); return Promise.resolve(); };
      window.rewardedBreak = function(opts){ safe(opts && opts.before); safe(opts && opts.after); return Promise.resolve({completed:false}); };

      window.PauseGame = window.PauseGame || function(){};
      window.ResumeGame = window.ResumeGame || function(){};
      var noop = function(){};
      ['GamePlayStart','GamePlayStop','GameplayStart','GameplayStop','gameplayStart','gameplayStop','GameStart','GameStop']
        .forEach(function(n){ window[n] = window[n] || noop; });
    })();
  </script>

  <!-- Game engine -->
  <script src="https://cdn.jsdelivr.net/gh/brodeliver/bb@12/BasketBros.js?th=644"></script>

  <script>
    window.addEventListener("touchmove", function (event) { event.preventDefault(); }, { capture: false, passive: false });
    if (typeof window.devicePixelRatio !== "undefined" && window.devicePixelRatio > 2) {
      var meta = document.getElementById("viewport");
      meta.setAttribute("content", "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", user-scalable=no");
    }
    window.addEventListener("keydown", function (e) {
      if ((e.keyCode === 32 || e.keyCode === 38 || e.keyCode === 40) && e.target === document.body) e.preventDefault();
    });
  </script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; color: #ffa500; overflow: hidden; }
    #openfl-content { background: #000; width: 100%; height: 100%; }
    #loading { position: absolute; z-index: 15; top: 60%; left: 50%; transform: translate(-50%, 0); background: #000; }
    #loading img { display: inline-block; }
    footer { background: #000; padding: 16px 0; text-align: center; color: #ccc; font-size: 14px; border-top: 1px solid #222; }
  </style>

  <!-- Firebase (cloud save / sign-in) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDeQ1CV2ZfZg4SJlu9CEWfpHG3--xpt-oU",
      authDomain: "basket-bros-43586.firebaseapp.com",
      projectId: "basket-bros-43586",
      storageBucket: "basket-bros-43586.appspot.com",
      messagingSenderId: "179647849243",
      appId: "1:179647849243:web:87b99f44ca23f8a11729be"
    };
    try {
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();
      var userData = "";

      function triggerSignIn() { var p = new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p); }
      function saveGameData(gameData) {
        try {
          var uid = auth.currentUser && auth.currentUser.uid; if (!uid) return;
          userData = gameData;
          db.collection('users').doc(uid).set({ gameData });
        } catch (e) { /* ignore */ }
      }
      function loadGameData() { return userData; }
      function loadGameDataAsync() {
        var uid = auth.currentUser && auth.currentUser.uid; if (!uid) return;
        db.collection('users').doc(uid).get().then(function (doc) {
          if (doc.exists) { userData = doc.data().gameData; if (typeof Main !== 'undefined' && Main.LoadDataComplete) Main.LoadDataComplete(); }
        });
      }
      auth.onAuthStateChanged(function (user) { if (user) { loadGameDataAsync(); } });
      function signOut() { auth.signOut().then(() => { if (typeof Main !== 'undefined' && Main.SignOutComplete) Main.SignOutComplete(); }); }
      function isUserLoggedIn() { return auth.currentUser !== null; }
      window.triggerSignIn = triggerSignIn;
      window.saveGameData = saveGameData;
      window.loadGameData = loadGameData;
      window.loadGameDataAsync = loadGameDataAsync;
      window.signOut = signOut;
      window.isUserLoggedIn = isUserLoggedIn;
    } catch (e) { /* Firebase optional */ }
  </script>
</head>
