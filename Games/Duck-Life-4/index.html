<html>
<head>
<meta charset="UTF-8">
<style>
body,html{margin:0;padding:0;overflow:hidden;width:100%;height:100%}
#container{margin:0;padding:0;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center}
canvas{display:block}
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  "autoplay": "off",
  "polyfills": true,
  "letterbox": "on",
  "backgroundColor": null,
  "scale": "showAll",
  "allowFullscreen": true,
  "forceScale": true,
  "forceAlign": true,
  "splashScreen": true,
  "wmode": "Window",
  "unmuteOverlay": "hidden",
  "quality": "high"
};
window.addEventListener("load", () => {
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  const container = document.getElementById("container");
  container.appendChild(player);
  player.load("https://cdn.jsdelivr.net/gh/dylanbruhberg/Duck-Life-4-SWF@0fb26d031aa6ef21b9ba257d72628ddfe0742bd9/ducklife4.swf");
  player.style.width = "100%";
  player.style.height = "100%";
});
</script>
<title>Duck Life 4</title>
</head>
<body>
<div id="container"></div>
</body>
</html>
